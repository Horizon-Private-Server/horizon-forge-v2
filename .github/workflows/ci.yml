name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    steps:
      - name: Check out Forge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.nuget/packages
            .dependencies/ratchet-ps2-cli
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json', 'global.json', 'ratchet-sdk.version') }}

      - name: Install frontend dependencies
        shell: bash
        run: |
          mkdir -p artifacts/ci-logs
          npm ci 2>&1 | tee artifacts/ci-logs/npm-ci.log

      - name: Bootstrap pinned Ratchet SDK
        shell: bash
        run: bash scripts/bootstrap-ratchet-sdk.sh 2>&1 | tee artifacts/ci-logs/sdk-bootstrap.log

      - name: Build and test
        shell: bash
        run: npm test 2>&1 | tee artifacts/ci-logs/test.log

      - name: Resolve package identity
        shell: bash
        run: |
          base_version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            version=$(node scripts/nightly-version.mjs "$base_version" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA")
            channel=nightly
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(node scripts/stable-version.mjs "$base_version" "$GITHUB_REF_NAME")
            channel=stable
          else
            version=$base_version
            channel=development
          fi
          echo "FORGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "FORGE_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: Package Linux app
        if: runner.os == 'Linux'
        shell: bash
        env:
          FORGE_COMMIT: ${{ github.sha }}
        run: npm run package:linux 2>&1 | tee artifacts/ci-logs/package.log

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: bash
        env:
          FORGE_COMMIT: ${{ github.sha }}
        run: npm run package:windows 2>&1 | tee artifacts/ci-logs/package.log

      - name: Smoke packaged Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo chown root:root artifacts/horizon-forge-linux-x64/chrome-sandbox
          sudo chmod 4755 artifacts/horizon-forge-linux-x64/chrome-sandbox
          bash scripts/smoke-package-linux.sh artifacts/ci-logs/package-smoke.log

      - name: Archive Linux release package
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && runner.os == 'Linux'
        shell: bash
        working-directory: artifacts
        run: |
          archive="horizon-forge-${FORGE_VERSION}-linux-x64.tar.gz"
          tar -czf "$archive" horizon-forge-linux-x64
          sha256sum "$archive" > "$archive.sha256"

      - name: Archive Windows release package
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && runner.os == 'Windows'
        shell: pwsh
        working-directory: artifacts
        run: |
          $archive = "horizon-forge-$env:FORGE_VERSION-windows-x64.zip"
          Compress-Archive -Path horizon-forge-windows-x64 -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File -FilePath "$archive.sha256" -Encoding ascii -NoNewline

      - name: Upload release package
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ runner.os }}
          path: |
            artifacts/horizon-forge-*.tar.gz
            artifacts/horizon-forge-*.tar.gz.sha256
            artifacts/horizon-forge-*.zip
            artifacts/horizon-forge-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-logs-${{ runner.os }}
          path: artifacts/ci-logs
          if-no-files-found: ignore
          retention-days: 7

  nightly:
    name: Publish nightly
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out Forge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve nightly identity
        id: nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_version=$(node -p "require('./package.json').version")
          version=$(node scripts/nightly-version.mjs "$base_version" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download nightly packages
        if: steps.nightly.outputs.exists != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish nightly prerelease
        if: steps.nightly.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ steps.nightly.outputs.tag }}
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
        run: |
          sdk_revision=$(tr -d '[:space:]' < ratchet-sdk.version)
          node scripts/release-manifest.mjs release-assets "$NIGHTLY_VERSION" nightly \
            "$GITHUB_SHA" "$sdk_revision" "$NIGHTLY_TAG" release-assets/release-manifest.json
          notes_file="$RUNNER_TEMP/nightly-notes.md"
          printf 'Automated unsupported alpha nightly.\n\nCommit: %s\nRatchet SDK: %s\nChannel: nightly\n' \
            "$GITHUB_SHA" "$sdk_revision" > "$notes_file"
          gh release create "$NIGHTLY_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Horizon Forge $NIGHTLY_VERSION" \
            --notes-file "$notes_file" \
            --prerelease \
            --latest=false

  stable:
    name: Publish stable release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: stable-release
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out Forge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve stable identity
        id: stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          version=$(node scripts/stable-version.mjs "$package_version" "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            state=$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv')
            [[ "$state" == $'false\tfalse' ]] || {
              echo "Existing release $GITHUB_REF_NAME is not a published stable release" >&2
              exit 1
            }
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download stable packages
        if: steps.stable.outputs.exists != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish stable release
        if: steps.stable.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_VERSION: ${{ steps.stable.outputs.version }}
        run: |
          sdk_revision=$(tr -d '[:space:]' < ratchet-sdk.version)
          node scripts/release-manifest.mjs release-assets "$STABLE_VERSION" stable \
            "$GITHUB_SHA" "$sdk_revision" "$GITHUB_REF_NAME" release-assets/release-manifest.json
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Horizon Forge $STABLE_VERSION" \
            --generate-notes \
            --latest
