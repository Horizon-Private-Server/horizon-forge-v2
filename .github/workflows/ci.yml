name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    steps:
      - name: Check out Forge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.nuget/packages
            .dependencies/ratchet-ps2-cli
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json', 'global.json', 'ratchet-sdk.version') }}

      - name: Install frontend dependencies
        shell: bash
        run: |
          mkdir -p artifacts/ci-logs
          npm ci 2>&1 | tee artifacts/ci-logs/npm-ci.log

      - name: Bootstrap pinned Ratchet SDK
        shell: bash
        run: bash scripts/bootstrap-ratchet-sdk.sh 2>&1 | tee artifacts/ci-logs/sdk-bootstrap.log

      - name: Build and test
        shell: bash
        run: npm test 2>&1 | tee artifacts/ci-logs/test.log

      - name: Package Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: npm run package:linux 2>&1 | tee artifacts/ci-logs/package.log

      - name: Smoke packaged Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/smoke-package-linux.sh artifacts/ci-logs/package-smoke.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-logs-${{ runner.os }}
          path: artifacts/ci-logs
          if-no-files-found: ignore
          retention-days: 7
